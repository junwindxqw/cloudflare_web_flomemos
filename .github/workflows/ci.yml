name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 内置 undici 8 依赖 Node 22+ 的 util.markAsUncloneable
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test