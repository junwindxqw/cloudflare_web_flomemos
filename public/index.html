<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Flomemos · 云端便签</title>
  <meta name="description" content="Flomemos —— 部署在 Cloudflare 免费服务上的 flomo 风格多用户笔记便签">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0aa870">
  <meta name="apple-mobile-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-mobile-web-app-title" content="Flomemos">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <!-- 登录 / 注册 / 找回密码视图 -->
  <div id="auth-view" class="auth-view hidden">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="brand-logo">浮</span>
        <h1>Flomemos</h1>
        <p class="auth-subtitle" data-i18n="auth.tagline">轻记录，像发消息一样简单</p>
      </div>

      <div id="auth-tabs" class="auth-tabs">
        <button type="button" class="auth-tab active" data-tab="login" data-i18n="auth.tabLogin">登录</button>
        <button type="button" class="auth-tab" data-tab="register" data-i18n="auth.tabRegister">注册</button>
        <button type="button" class="auth-tab" data-tab="reset" data-i18n="auth.tabReset">找回密码</button>
      </div>

      <form id="login-form" autocomplete="on">
        <label class="field">
          <span data-i18n="auth.email">邮箱</span>
          <input type="email" id="login-email" name="email" autocomplete="email" required>
        </label>
        <label class="field">
          <span data-i18n="auth.password">密码</span>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required>
        </label>
        <p id="login-error" class="form-error hidden"></p>
        <button type="submit" class="btn btn-primary btn-block" id="login-submit" data-i18n="btn.login">登 录</button>
      </form>

      <form id="register-form" class="hidden" autocomplete="off">
        <p id="register-hint" class="setup-hint hidden" data-i18n="auth.adminHint">🎉 你是第一位注册的用户，将自动成为本站管理员</p>
        <label class="field">
          <span data-i18n="auth.email">邮箱</span>
          <input type="email" id="register-email" required>
        </label>
        <label class="field">
          <span data-i18n="auth.code">邮箱验证码</span>
          <span class="code-row">
            <input type="text" id="register-code" inputmode="numeric" maxlength="4" data-i18n-placeholder="auth.codePlaceholder" placeholder="4 位数字" required>
            <button type="button" id="register-send" class="btn btn-ghost send-btn" data-i18n="btn.sendCode">发送验证码</button>
          </span>
        </label>
        <label class="field">
          <span data-i18n="auth.passwordHint">密码（至少 6 位）</span>
          <input type="password" id="register-password" minlength="6" maxlength="128" required>
        </label>
        <label class="field">
          <span data-i18n="auth.password2">确认密码</span>
          <input type="password" id="register-password2" minlength="6" maxlength="128" required>
        </label>
        <p id="register-error" class="form-error hidden"></p>
        <button type="submit" class="btn btn-primary btn-block" data-i18n="btn.register">注册并进入</button>
      </form>

      <form id="reset-form" class="hidden" autocomplete="off">
        <p class="setup-hint" data-i18n="auth.resetHint">输入注册邮箱，我们会发送 4 位数字验证码用于重置密码。</p>
        <label class="field">
          <span data-i18n="auth.email">邮箱</span>
          <input type="email" id="reset-email" required>
        </label>
        <label class="field">
          <span data-i18n="auth.code">邮箱验证码</span>
          <span class="code-row">
            <input type="text" id="reset-code" inputmode="numeric" maxlength="4" data-i18n-placeholder="auth.codePlaceholder" placeholder="4 位数字" required>
            <button type="button" id="reset-send" class="btn btn-ghost send-btn" data-i18n="btn.sendCode">发送验证码</button>
          </span>
        </label>
        <label class="field">
          <span data-i18n="auth.newPasswordHint">新密码（至少 6 位）</span>
          <input type="password" id="reset-password" minlength="6" maxlength="128" required>
        </label>
        <p id="reset-error" class="form-error hidden"></p>
        <button type="submit" class="btn btn-primary btn-block" data-i18n="btn.reset">重置密码</button>
      </form>
    </div>
    <p class="auth-footer" data-i18n="auth.footer">Flomemos · 私有部署 · 运行于 Cloudflare Workers</p>
  </div>

  <!-- 主视图 -->
  <div id="main-view" class="layout hidden">
    <div id="sidebar-mask" class="sidebar-mask"></div>

    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <span class="brand-logo">浮</span>
        <span class="brand-name">Flomemos</span>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-nav="all"><span data-i18n="nav.all">📝 全部笔记</span> <span class="nav-count" id="count-total"></span></button>
        <button class="nav-item" data-nav="pinned"><span data-i18n="nav.pinned">⭐ 收藏</span></button>
        <button class="nav-item hidden" data-nav="trash" id="nav-trash"><span data-i18n="nav.trash">🗑 回收站</span></button>
        <button class="nav-item hidden" data-nav="batch" id="nav-batch"><span data-i18n="nav.batch">☑ 多选</span></button>
        <button class="nav-item" data-nav="review"><span data-i18n="nav.review">🎲 随机回顾</span></button>
        <button class="nav-item" data-nav="stats"><span data-i18n="nav.stats">📊 统计</span></button>
        <button class="nav-item hidden" data-nav="admin" id="nav-admin"><span data-i18n="nav.admin">👥 用户管理</span></button>
      </nav>

      <div class="side-section">
        <div class="side-title" data-i18n="side.tags">标签</div>
        <div id="tag-list" class="tag-list"></div>
      </div>

      <div class="side-footer">
        <button id="theme-toggle" class="side-link">🌓 跟随系统</button>
        <button id="lang-toggle" class="side-link">🌐 EN</button>
        <button id="export-md" class="side-link" data-i18n="side.exportMd">⬇️ 导出 Markdown</button>
        <button id="export-json" class="side-link" data-i18n="side.exportJson">⬇️ 导出 JSON</button>
        <button id="import-btn" class="side-link" data-i18n="side.import">📥 导入</button>
        <input type="file" id="import-input" accept=".md,.json,.markdown" hidden>
        <button id="logout" class="side-link danger" data-i18n="side.logout">↩ 退出登录</button>
        <div id="side-user" class="side-user"></div>
      </div>
    </aside>

    <main class="main" id="main-scroll">
      <header class="topbar">
        <button id="menu-btn" class="icon-btn menu-btn" title="菜单">☰</button>
        <div class="search-box">
          <input type="search" id="search-input" placeholder="搜索笔记…" autocomplete="off">
          <button id="search-clear" class="icon-btn hidden" title="清除">✕</button>
        </div>
      </header>

      <div class="main-inner">
        <section id="filter-bar" class="filter-bar hidden">
          <span id="filter-text" class="filter-chip"></span>
          <button id="filter-clear" class="icon-btn" title="取消过滤">✕</button>
        </section>

        <section id="selected-bar" class="selected-bar hidden"></section>

        <section id="editor-mount"></section>

        <section id="memo-list" class="memo-list" aria-live="polite"></section>
        <div id="sentinel" class="sentinel hidden"><span class="spinner"></span></div>
        <p id="list-end" class="list-end hidden">· 到底啦 ·</p>
      </div>
    </main>
  </div>

  <!-- 随机回顾弹窗 -->
  <div id="review-modal" class="modal hidden">
    <div class="modal-mask" data-close="review-modal"></div>
    <div class="modal-dialog">
      <header class="modal-head">
        <h2 data-i18n="review.title">🎲 随机回顾</h2>
        <div class="modal-actions">
          <select id="review-num" class="review-num">
            <option value="5">5 条</option>
            <option value="10">10 条</option>
          </select>
          <button id="review-refresh" class="btn btn-ghost" data-i18n="review.refresh">换一批</button>
          <button class="icon-btn" data-close="review-modal" title="关闭">✕</button>
        </div>
      </header>
      <div id="review-body" class="modal-body"></div>
    </div>
  </div>

  <!-- 统计弹窗 -->
  <div id="stats-modal" class="modal hidden">
    <div class="modal-mask" data-close="stats-modal"></div>
    <div class="modal-dialog">
      <header class="modal-head">
        <h2 data-i18n="stats.title">📊 统计</h2>
        <div class="modal-actions">
          <button class="icon-btn" data-close="stats-modal" title="关闭">✕</button>
        </div>
      </header>
      <div id="stats-body" class="modal-body"></div>
    </div>
  </div>

  <!-- 用户管理弹窗（仅管理员） -->
  <div id="admin-modal" class="modal hidden">
    <div class="modal-mask" data-close="admin-modal"></div>
    <div class="modal-dialog">
      <header class="modal-head">
        <h2 data-i18n="admin.title">👥 用户管理</h2>
        <div class="modal-actions">
          <input type="search" id="admin-search" class="admin-search" placeholder="搜索邮箱…">
          <button id="admin-refresh" class="btn btn-ghost" data-i18n="admin.refresh">刷新</button>
          <button class="icon-btn" data-close="admin-modal" title="关闭">✕</button>
        </div>
      </header>
      <div id="admin-body" class="modal-body"></div>
    </div>
  </div>

  <div id="toast-wrap" class="toast-wrap"></div>

  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
